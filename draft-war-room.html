<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft War Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --ink: #10161c; --panel: #18212a; --panel-2: #1f2b35;
  --line: #2b3945; --line-soft: #222e38;
  --text: #e6ecf2; --muted: #7f8f9d; --dim: #5b6a77;
  --qb: #f2a65a; --rb: #46b47a; --wr: #5b9ee8; --te: #c07dd6; --flx: #8595a3;
  --alert: #e8574a; --gold: #e8c46a;
  --display: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
  --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink); color: var(--text); font-family: var(--body);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button[disabled] { opacity: .4; cursor: not-allowed; }
input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.shell { max-width: 1180px; margin: 0 auto; padding-bottom: 88px; }

/* masthead */
.top { position: sticky; top: 0; z-index: 30; background: rgba(16,22,28,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { padding: 10px 14px 8px; display: flex; align-items: center; gap: 10px; }
.mark { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.mark span { color: var(--gold); }
.leaguesel { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 13px; max-width: 46%; }

.clock { display: flex; border-top: 1px solid var(--line-soft); font-family: var(--display); }
.cl { flex: 1; padding: 7px 10px 8px; border-right: 1px solid var(--line-soft); min-width: 0; }
.cl:last-child { border-right: none; }
.cl-k { font-family: var(--body); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.cl-v { font-size: 21px; font-weight: 700; line-height: 1.05; }
.cl-v.hot { color: var(--gold); } .cl-v.alert { color: var(--alert); }
.cl-v small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 3px; }

/* tabs */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; display: flex; background: rgba(16,22,28,.97); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
.tab { flex: 1; padding: 11px 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--dim); border-top: 2px solid transparent; }
.tab.on { color: var(--text); border-top-color: var(--gold); background: var(--panel); }

.pane { padding: 14px; }
.h { font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 9px; display: flex; align-items: center; gap: 8px; }
.h::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px; margin-bottom: 13px; }
.card.you { border-color: var(--gold); }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; }
.note b { color: var(--text); font-weight: 600; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.btn:hover:not([disabled]) { border-color: var(--dim); }
.btn.pri { background: var(--gold); color: #1a1408; border-color: var(--gold); }
.btn.warn { color: var(--alert); }
.btn.sm { padding: 4px 9px; font-size: 11px; }
.in { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; width: 100%; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row-btns { display: flex; gap: 7px; }

.filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .07em; color: var(--muted); background: var(--panel); }
.chip.on { color: var(--ink); }
.chip.on[data-p="ALL"] { background: var(--text); border-color: var(--text); }
.chip.on[data-p="QB"] { background: var(--qb); border-color: var(--qb); }
.chip.on[data-p="RB"] { background: var(--rb); border-color: var(--rb); }
.chip.on[data-p="WR"] { background: var(--wr); border-color: var(--wr); }
.chip.on[data-p="TE"] { background: var(--te); border-color: var(--te); }

/* tier divider — the signature */
.tierbar { display: flex; align-items: center; gap: 9px; padding: 13px 2px 5px; }
.tierbar-l { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tierbar-rule { flex: 1; height: 1px; background: var(--line); }
.tierbar-drop { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--gold); white-space: nowrap; }
.tierbar-drop.big { color: var(--alert); }
.tierbar-left { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.tierbar-left.thin { color: var(--alert); }

/* player row */
.prow { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-soft); }
.prow.lead { background: rgba(232,196,106,.06); }
.spark { width: 3px; border-radius: 2px; flex: none; opacity: .85; min-height: 14px; }
.pos { font-family: var(--display); font-weight: 700; font-size: 12px; width: 34px; flex: none; text-align: center; padding: 3px 0; border-radius: 4px; color: var(--ink); }
.pos[data-p="QB"] { background: var(--qb); } .pos[data-p="RB"] { background: var(--rb); }
.pos[data-p="WR"] { background: var(--wr); } .pos[data-p="TE"] { background: var(--te); }
.pname { flex: 1; min-width: 0; }
.pname-t { font-size: 14px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname-s { font-size: 10.5px; color: var(--dim); letter-spacing: .05em; margin-top: 1px; }
.tag { color: var(--gold); font-size: 11px; margin-left: 6px; font-weight: 600; }
.tag.rookie { color: var(--flx); }
.pname-s .bust { color: var(--alert); }
.vdelta { font-weight: 700; }
.vdelta.up { color: var(--gold); }
.vdelta.down { color: var(--alert); }
.pvor { text-align: right; flex: none; }
.pvor-t { font-family: var(--mono); font-size: 15px; font-weight: 600; line-height: 1.1; }
.pvor-t.neg { color: var(--dim); }
.pvor-s { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 1px; }
.acts { display: flex; gap: 5px; flex: none; }
.act { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); font-size: 15px; font-weight: 700; background: var(--panel-2); }
.act.mine { color: var(--gold); } .act.mine:hover { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.act.gone { color: var(--dim); } .act.gone:hover { background: var(--alert); color: #fff; border-color: var(--alert); }

/* roster */
.slots { display: flex; flex-direction: column; gap: 5px; }
.slot { display: flex; align-items: center; gap: 9px; padding: 7px 9px; background: var(--panel-2); border-radius: 6px; border-left: 3px solid var(--line); font-size: 13px; }
.slot[data-p="QB"] { border-left-color: var(--qb); } .slot[data-p="RB"] { border-left-color: var(--rb); }
.slot[data-p="WR"] { border-left-color: var(--wr); } .slot[data-p="TE"] { border-left-color: var(--te); }
.slot-k { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--muted); width: 46px; flex: none; }
.slot-v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-v.empty { color: var(--dim); font-style: italic; }

.rec { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.rec:last-of-type { border-bottom: none; }
.rec-n { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--dim); width: 16px; flex: none; text-align: center; }
.rec-b { flex: 1; min-width: 0; }
.rec-t { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-r { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rec-v { font-size: 16px; font-weight: 600; color: var(--gold); flex: none; }
.run { display: flex; gap: 3px; margin-top: 7px; }
.run-c { flex: 1; height: 6px; border-radius: 2px; background: var(--line-soft); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld-k { font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.banner { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; background: rgba(232,196,106,.09); border: 1px solid rgba(232,196,106,.3); color: #e9d6a4; margin-bottom: 13px; }
.banner.ok { background: rgba(70,180,122,.1); border-color: rgba(70,180,122,.32); color: #a5dcbe; }
.empty { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.6; }
.kbd { font-family: var(--mono); font-size: 10.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--text); }

@media (min-width: 860px) {
  .two { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
  .tabs { position: sticky; top: 0; bottom: auto; border-top: none; border-bottom: 1px solid var(--line); }
  .tab { padding: 12px 4px; border-top: none; border-bottom: 2px solid transparent; }
  .tab.on { border-bottom-color: var(--gold); border-top-color: transparent; }
  .shell { padding-bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* printed cheat sheet */
@media print {
  body { background: #fff; color: #000; }
  .top, .tabs, .acts, .card, .filters, .banner, .no-print { display: none !important; }
  .pane { padding: 0; }
  .prow { border-bottom: 1px solid #ddd; padding: 3px 0; page-break-inside: avoid; }
  .pname-t { font-size: 11px; } .pname-s { color: #777; }
  .pvor-t { font-size: 11px; } .spark { display: none; }
  .pos { color: #000 !important; background: none !important; border: 1px solid #999; font-size: 10px; }
  .tierbar { padding: 7px 0 2px; } .tierbar-l, .tierbar-drop, .tierbar-left { color: #000; }
  .tierbar-rule { background: #000; }
  #print-head { display: block !important; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
}
#print-head { display: none; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-in">
      <div class="mark">Draft <span>War Room</span></div>
      <select class="leaguesel" id="leaguesel" data-a="switch" aria-label="Active league"></select>
    </div>
    <div class="clock" id="clock"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";

/* ============================================================
   DRAFT WAR ROOM — standalone. No build step, no dependencies.
   Saves to this browser's localStorage.
   ============================================================ */

/* ---------- demo data (real names, invented projections) ---------- */
var DEMO_RAW = [
["Josh Allen","QB",4100,33,12,530,8,0,0,0,4],["Jalen Hurts","QB",3850,26,10,610,12,0,0,0,5],
["Lamar Jackson","QB",3700,29,8,720,5,0,0,0,4],["Patrick Mahomes","QB",4300,31,10,290,3,0,0,0,4],
["Joe Burrow","QB",4450,34,11,130,2,0,0,0,3],["C.J. Stroud","QB",4150,26,9,190,3,0,0,0,4],
["Jayden Daniels","QB",3600,22,9,690,6,0,0,0,5],["Dak Prescott","QB",4000,27,11,120,2,0,0,0,4],
["Justin Herbert","QB",3900,24,9,230,3,0,0,0,4],["Bo Nix","QB",3500,21,12,340,4,0,0,0,5],
["Bijan Robinson","RB",0,0,0,1290,11,62,480,3,2],["Saquon Barkley","RB",0,0,0,1380,13,38,290,1,2],
["Jahmyr Gibbs","RB",0,0,0,1080,10,58,450,3,2],["Christian McCaffrey","RB",0,0,0,980,8,64,510,3,1],
["De'Von Achane","RB",0,0,0,920,7,71,560,3,2],["Ashton Jeanty","RB",0,0,0,1150,9,42,320,2,3],
["Derrick Henry","RB",0,0,0,1320,14,18,130,0,2],["Jonathan Taylor","RB",0,0,0,1180,10,32,240,1,2],
["Josh Jacobs","RB",0,0,0,1090,9,40,300,2,2],["Kyren Williams","RB",0,0,0,1040,11,33,240,1,3],
["Breece Hall","RB",0,0,0,880,6,55,420,2,2],["James Cook","RB",0,0,0,970,8,36,270,1,2],
["Chase Brown","RB",0,0,0,840,7,48,370,2,2],["Omarion Hampton","RB",0,0,0,790,6,31,230,1,2],
["Kenneth Walker III","RB",0,0,0,830,7,38,290,1,2],["Alvin Kamara","RB",0,0,0,700,5,62,480,2,2],
["Tony Pollard","RB",0,0,0,810,5,42,320,1,2],["Rhamondre Stevenson","RB",0,0,0,760,5,39,290,1,3],
["Ja'Marr Chase","WR",0,0,0,20,0,112,1520,12,1],["Justin Jefferson","WR",0,0,0,10,0,104,1490,9,1],
["CeeDee Lamb","WR",0,0,0,15,0,101,1330,9,1],["Amon-Ra St. Brown","WR",0,0,0,10,0,106,1240,10,1],
["Puka Nacua","WR",0,0,0,30,0,98,1290,7,1],["Malik Nabers","WR",0,0,0,12,0,99,1270,8,1],
["Nico Collins","WR",0,0,0,0,0,84,1220,8,1],["Brian Thomas Jr.","WR",0,0,0,18,0,86,1240,9,1],
["Drake London","WR",0,0,0,0,0,89,1180,8,1],["A.J. Brown","WR",0,0,0,0,0,80,1210,8,1],
["Tyreek Hill","WR",0,0,0,22,0,83,1130,7,1],["Garrett Wilson","WR",0,0,0,0,0,88,1090,6,1],
["Ladd McConkey","WR",0,0,0,10,0,84,1080,6,1],["Marvin Harrison Jr.","WR",0,0,0,0,0,76,1060,8,1],
["Davante Adams","WR",0,0,0,0,0,79,1020,8,1],["Jaxon Smith-Njigba","WR",0,0,0,0,0,81,1040,6,1],
["DK Metcalf","WR",0,0,0,0,0,68,1010,7,1],["Terry McLaurin","WR",0,0,0,0,0,71,980,7,1],
["Zay Flowers","WR",0,0,0,25,0,74,930,5,1],["Courtland Sutton","WR",0,0,0,0,0,69,940,6,1],
["Brock Bowers","TE",0,0,0,0,0,94,1080,7,1],["Trey McBride","TE",0,0,0,0,0,89,940,5,1],
["George Kittle","TE",0,0,0,0,0,68,880,7,1],["Sam LaPorta","TE",0,0,0,0,0,66,760,6,1],
["Travis Kelce","TE",0,0,0,0,0,71,760,4,1],["Mark Andrews","TE",0,0,0,0,0,58,660,7,1],
["T.J. Hockenson","TE",0,0,0,0,0,63,690,4,1],["David Njoku","TE",0,0,0,0,0,60,650,4,1]
];
var STAT_ORDER = ["passYd","passTD","int","rushYd","rushTD","rec","recYd","recTD","fl"];
function demoPlayers() {
  var out = DEMO_RAW.map(function (r, i) {
    var p = { id: "d" + i, name: r[0], team: "", pos: r[1], stats: {} };
    STAT_ORDER.forEach(function (k, j) { p.stats[k] = r[j + 2]; });
    return p;
  });
  // A 12-team league starts more players than the named list holds. Without depth
  // behind them the replacement baseline falls off the end of the board and every
  // value inflates, so extend each position with a decaying tail.
  var DEPTH = { QB: 26, RB: 54, WR: 64, TE: 22 };
  Object.keys(DEPTH).forEach(function (pos) {
    var same = out.filter(function (p) { return p.pos === pos; });
    var last = same[same.length - 1];
    if (!last) return;
    for (var i = same.length; i < DEPTH[pos]; i++) {
      var f = Math.pow(0.955, i - same.length + 1);
      var p = { id: pos + "f" + i, name: pos + " depth " + (i + 1), team: "", pos: pos, stats: {} };
      STAT_ORDER.forEach(function (k) { p.stats[k] = Math.round(last.stats[k] * f); });
      out.push(p);
    }
  });
  return out;
}

/* ---------- config ---------- */
var VAL_POS = ["QB", "RB", "WR", "TE"];
var ROSTER_KEYS = ["QB","RB","WR","TE","FLEX","SUPERFLEX","K","DST","BENCH"];
var PRESETS = { ppr:{key:"ppr",label:"Full PPR",rec:1}, half:{key:"half",label:"Half PPR",rec:.5}, standard:{key:"standard",label:"Standard",rec:0} };
var POSVAR = { QB:"--qb", RB:"--rb", WR:"--wr", TE:"--te" };

function baseScoring(rec) {
  return { passYd:.04, passTD:4, int:-2, rushYd:.1, rushTD:6, rec:rec, recYd:.1, recTD:6, fl:-2 };
}
function newLeague(name, preset, teams, slot) {
  return {
    id: "lg_" + Math.random().toString(36).slice(2, 9),
    name: name, teams: teams, slot: slot, preset: preset,
    scoring: baseScoring(PRESETS[preset].rec),
    roster: { QB:1, RB:2, WR:2, TE:1, FLEX:1, SUPERFLEX:0, K:1, DST:1, BENCH:6 }
  };
}

/* ---------- state ---------- */
// Pre-seeded with your two real leagues. ESPN draft slot defaults to 1 —
// not a placeholder to fix, this league draws slots live on draft day
// (2026-08-29), so it's genuinely unknown until then. Set it in the League
// tab right when the room draws slots, before the clock starts.
// Scoring confirmed 2026-08-12 from the Yahoo league's settings page and
// applied to both leagues by request (one shared ruleset, ESPN's own
// settings never separately verified): full PPR, non-default passing rates
// too — 20 yd/pt (not 25) and 6-pt passing TDs (not 4). Both meaningfully
// boost QB value beyond a plain "ppr" preset, especially high-volume/
// rushing QBs.
var ESPN_LEAGUE = newLeague("ESPN League (Aug 29)", "ppr", 10, 1);
var YAHOO_LEAGUE = newLeague("Yahoo League (Sept 6)", "ppr", 12, 2);
ESPN_LEAGUE.scoring.passYd = .05;
ESPN_LEAGUE.scoring.passTD = 6;
YAHOO_LEAGUE.scoring.passYd = .05;
YAHOO_LEAGUE.scoring.passTD = 6;
// confirmed roster: QB1 RB2 WR2 TE1 FLEX(W-R-T)1 K1 DEF1 BN6 IR2 — this tool
// has no separate IR concept, so the 2 IR spots are folded into bench (8)
// to keep the total draft-round count accurate
YAHOO_LEAGUE.roster.BENCH = 8;

var S = {
  tab: "board", filter: "ALL", q: "", flash: "", sort: "value",
  leagues: [ESPN_LEAGUE, YAHOO_LEAGUE],
  activeId: null, players: demoPlayers(), usingDemo: true, drafts: {}
};
var KEY = "draftWarRoom.v1";

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      leagues: S.leagues, activeId: S.activeId, players: S.players,
      usingDemo: S.usingDemo, drafts: S.drafts
    }));
  } catch (e) { /* private mode / quota — app still works this session */ }
}
// One-time correction for saves made before real scoring was confirmed
// (2026-08-12): both real leagues were placeholder-scored (half-PPR,
// 25 yd/pt passing, 4-pt passing TD). Runs once per browser, matched by
// league name since ids are randomly generated per-browser and won't
// line up with the seed constants above.
var SCORING_FIX_KEY = "draftWarRoom.scoringFix.2026-08-12";
function applyScoringFix(leagues) {
  if (localStorage.getItem(SCORING_FIX_KEY)) return;
  leagues.forEach(function (lg) {
    if (lg.name === "ESPN League (Aug 29)" || lg.name === "Yahoo League (Sept 6)") {
      lg.preset = "ppr";
      lg.scoring.rec = 1;
      lg.scoring.passYd = .05;
      lg.scoring.passTD = 6;
    }
  });
  localStorage.setItem(SCORING_FIX_KEY, "1");
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d.leagues && d.leagues.length) S.leagues = d.leagues;
    if (d.activeId) S.activeId = d.activeId;
    if (d.players && d.players.length) S.players = d.players;
    if (typeof d.usingDemo === "boolean") S.usingDemo = d.usingDemo;
    if (d.drafts) S.drafts = d.drafts;
    applyScoringFix(S.leagues);
    save();
  } catch (e) { /* corrupt save — fall back to defaults */ }
}
function league() {
  var l = S.leagues.filter(function (x) { return x.id === S.activeId; })[0];
  return l || S.leagues[0];
}
function draft() { return S.drafts[league().id] || { picks: [] }; }

/* ---------- value engine ---------- */
function scorePlayer(p, sc) {

      ? ' &middot; <span class="vdelta ' + (p.sosLabel === "Easy" ? "up" : "down") + '" title="His team\'s fantasy-playoff-week opponents (weeks configured in playoff_sos.py), by how much they allowed to his position last season. One season of data — a signal to weigh, not a guarantee.">Playoff ' + p.sosLabel + "</span>"
      : "";
    out.push('<div class="prow' + (withActs && i === 0 ? " lead" : "") + '">' +
      '<div class="spark" style="background:var(' + (POSVAR[p.pos] || "--flx") + ');height:' + h + 'px"></div>' +
      '<div class="pos" data-p="' + p.pos + '">' + p.pos + "</div>" +
      '<div class="pname"><div class="pname-t">' + esc(p.name) +
        (need && need[p.pos] ? '<span class="tag">need</span>' : "") +
        (p.rookie ? '<span class="tag rookie" title="Comp-based projection from draft capital, not his own NFL history">ROOKIE</span>' : "") + "</div>" +
        '<div class="pname-s">' + (sc ? esc(reasonFor(sc)) : p.pos + p.posRank + " &middot; OVR " + p.ovr + (p.team ? " &middot; " + esc(p.team) : "") + (p.bye != null ? " (bye " + p.bye + ")" : "")) +
        (p.rookie && p.bustPct != null ? ' &middot; <span class="' + (p.bustPct >= 40 ? "bust" : "") + '">' + p.bustPct + '% bust rate</span>' : "") +
        vBadge + sosBadge + "</div></div>" +
      '<div class="pvor"><div class="pvor-t' + ((sc ? sc.now : p.vor) <= 0 ? " neg" : "") + '">' + sgn(sc ? sc.now : p.vor) + "</div>" +
        '<div class="pvor-s">' + (sc ? p.pos + p.posRank : p.pts) + "</div></div>" +
      (withActs ? '<div class="acts">' +
        '<button class="act mine" title="I drafted him" data-a="pick" data-v="' + p.id + '" data-m="1">&#10003;</button>' +
        '<button class="act gone" title="Someone else took him" data-a="pick" data-v="' + p.id + '" data-m="0">&times;</button></div>' : "") +
      "</div>");
  });
  return out.join("");
}
function chips(active) {
  return '<div class="filters">' + ["ALL","QB","RB","WR","TE"].map(function (p) {
    return '<button class="chip' + (active === p ? " on" : "") + '" data-p="' + p + '" data-a="filter" data-v="' + p + '">' + p + "</button>";
  }).join("") + "</div>";
}
function filtered() {
  var a = S.filter === "ALL" ? BOARD : BOARD.filter(function (p) { return p.pos === S.filter; });
  if (S.q.trim()) {
    var s = S.q.toLowerCase();
    a = a.filter(function (p) { return p.name.toLowerCase().indexOf(s) >= 0; });
  }
  return a.slice(0, 140);
}

/* ---- board ---- */
function currentNeed() {
  var lg = league(), have = {}, need = {};
  MYTEAM.forEach(function (p) { have[p.pos] = (have[p.pos] || 0) + 1; });
  VAL_POS.forEach(function (pos) {
    var req = (lg.roster[pos] || 0) + (["RB","WR","TE"].indexOf(pos) >= 0 ? (lg.roster.FLEX || 0) : 0);
    need[pos] = (have[pos] || 0) < req;
  });
  return need;
}

function boardList() {
  var need = currentNeed();
  if (S.sort === "fit") {
    var scores = {};
    recommend(200).forEach(function (r) { scores[r.p.id] = r; });
    var items = filtered().slice().sort(function (a, b) {
      return (scores[b.id] ? scores[b.id].now : -9999) - (scores[a.id] ? scores[a.id].now : -9999);
    });
    return playerRows(items, S.filter, null, true, need, scores);
  }
  if (S.sort === "sleepers") {
    var withAdp = filtered().filter(function (p) { return p.vDelta != null; })
      .sort(function (a, b) { return b.vDelta - a.vDelta; });
    return playerRows(withAdp, S.filter, null, true, need, {});
  }
  return playerRows(filtered(), S.filter, S.filter === "ALL" ? "oTier" : "tier", true, need);
}

function recCard() {
  var all = recommend(200);
  var recs;
  if (all.length && all[0].forced) {
    // With more holes than picks, four options at one position is useless.
    // Lead with the best body at each slot you still have to fill.
    var seen = {}, head = [];
    all.forEach(function (r) { if (r.open && !seen[r.p.pos]) { seen[r.p.pos] = 1; head.push(r); } });
    recs = head.concat(all.filter(function (r) { return head.indexOf(r) < 0; })).slice(0, 4);
  } else {
    recs = all.slice(0, 4);
  }
  if (!recs.length) return "";
  return '<div class="card"><div class="h" style="margin:0 0 9px">Take now &middot; fitted to your roster</div>' +
    recs.map(function (r, i) {
      return '<div class="rec">' +
        '<div class="rec-n">' + (i + 1) + "</div>" +
        '<div class="pos" data-p="' + r.p.pos + '">' + r.p.pos + "</div>" +
        '<div class="rec-b"><div class="rec-t">' + esc(r.p.name) + "</div>" +
        '<div class="rec-r">' + esc(reasonFor(r)) + "</div></div>" +
        '<div class="rec-v num">' + sgn(r.now) + "</div>" +
        '<button class="act mine" title="I drafted him" data-a="pick" data-v="' + r.p.id + '" data-m="1">&#10003;</button></div>';
    }).join("") +
    '<div class="note" style="margin-top:9px">Score is what he adds to your <b>starting lineup</b>, minus what the best player at his position would still add if you waited a turn. Assumes the room drafts roughly by value &mdash; it sharpens once ADP goes in.</div></div>';
}

function viewBoard() {
  var lg = league(), c = clockInfo(), d = draft();
  var need = currentNeed();

  var byId = {}; V.list.forEach(function (p) { byId[p.id] = p; });
  var recent = d.picks.slice(-8).map(function (p) { return byId[p.id]; }).filter(Boolean);
  var runCount = {};
  recent.forEach(function (p) { runCount[p.pos] = (runCount[p.pos] || 0) + 1; });
  var runPos = Object.keys(runCount).sort(function (a, b) { return runCount[b] - runCount[a]; })[0];
  // ADP-aware "at risk": among the players worth caring about (top of the
  // board by our own value), who does the real ADP data say is unlikely to
  // survive to our next pick — not just "whoever's ranked in the next N
  // slots," which silently assumes the room drafts in our exact order.
  var nextPick = c.until == null ? null : c.onClock + c.until;
  var candidates = BOARD.slice(0, 80);
  var withProb = nextPick == null ? [] : candidates.map(function (p) {
    return { p: p, prob: survivalProb(p, lg, nextPick) };
  }).filter(function (x) { return x.prob != null; });
  var haveADP = withProb.length > 0;
  var atRisk = haveADP
    ? withProb.filter(function (x) { return x.prob < 0.45; })
        .sort(function (a, b) { return a.prob - b.prob; })
        .slice(0, 8)
        .map(function (x) { return x.p; })
    : (c.until ? BOARD.slice(0, c.until) : []);
  var atRiskProb = {};
  withProb.forEach(function (x) { atRiskProb[x.p.id] = x.prob; });

  // fill the starting lineup
  var pool = MYTEAM.slice(), starters = [], i, idx;
  ["QB","RB","RB","WR","WR","TE"].forEach(function (slot) {
    idx = -1;
    for (i = 0; i < pool.length; i++) if (pool[i].pos === slot) { idx = i; break; }
    starters.push({ slot: slot, p: idx >= 0 ? pool.splice(idx, 1)[0] : null });
  });
  for (var f = 0; f < (lg.roster.FLEX || 0); f++) {
    idx = -1;
    for (i = 0; i < pool.length; i++) if (["RB","WR","TE"].indexOf(pool[i].pos) >= 0) { idx = i; break; }
    starters.push({ slot: "FLEX", p: idx >= 0 ? pool.splice(idx, 1)[0] : null });
  }

  var banked = Math.round(MYTEAM.reduce(function (s, p) { return s + p.vor; }, 0) * 10) / 10;

  // Bye-week stacking: fine on the bench, a real problem among the guys who
  // actually start for you. 3+ starting-caliber players (VOR > 0, i.e. not
  // deep bench) sharing a week means one week where your lineup is thin no
  // matter what you do about it — worth knowing before it's too late to draft around.
  var byeCounts = {};
  MYTEAM.filter(function (p) { return p.vor > 0; }).forEach(function (p) {
    if (p.bye != null) byeCounts[p.bye] = (byeCounts[p.bye] || 0) + 1;
  });
  var heavyByes = Object.keys(byeCounts).filter(function (w) { return byeCounts[w] >= 3; })
    .sort(function (a, b) { return byeCounts[b] - byeCounts[a]; });

  return '<div class="pane">' +
    (S.usingDemo ? '<div class="banner"><span>&#9888;</span><div>Running on demo projections. The tiers are shaped right but the numbers are invented. <button class="btn sm" data-a="tab" data-v="data">Import real ones</button></div></div>' : "") +
    '<div class="two"><div>' +
      recCard() +
      (c.until != null && c.until > 0 && atRisk.length ?
        '<div class="card"><div class="h" style="margin:0 0 7px">Gone before you pick again</div>' +
        (haveADP ?
          '<div class="note">' + c.until + ' picks between now and your turn. By real ADP (not just our own rankings), these are ' +
          'unlikely to survive: <b>' + atRisk.map(function (p) {
            return esc(p.name) + ' (' + Math.round(atRiskProb[p.id] * 100) + '%)';
          }).join(', ') + '</b>.</div>' :
          '<div class="note">' + c.until + " picks between now and your turn. If the board goes chalk, these come off: <b>" +
          atRisk.map(function (p) { return esc(p.name); }).join(", ") + '</b>. <span style="color:var(--dim)">(No ADP data imported ' +
          'yet — this assumes the room drafts in our exact value order, which real rooms don\'t. Run adp.py for real odds.)</span></div>') +
        (runPos && runCount[runPos] >= 3 ? '<div class="note" style="margin-top:7px;color:var(--alert)">' + runCount[runPos] + " of the last " + recent.length + " picks were " + runPos + "s &mdash; that run is live.</div>" : "") +
        '<div class="run">' + recent.map(function (p) {
          return '<div class="run-c" style="background:var(' + (POSVAR[p.pos] || "--flx") + ')" title="' + esc(p.name) + '"></div>';
        }).join("") + "</div></div>" : "") +

      '<div class="filters" style="margin-bottom:8px">' +
        '<button class="chip' + (S.sort === "value" ? " on" : "") + '" data-p="ALL" data-a="sort" data-v="value">Value board</button>' +
        '<button class="chip' + (S.sort === "fit" ? " on" : "") + '" data-p="ALL" data-a="sort" data-v="fit">Fit to my roster</button>' +
        '<button class="chip' + (S.sort === "sleepers" ? " on" : "") + '" data-p="ALL" data-a="sort" data-v="sleepers">Sleepers</button>' +
      "</div>" +
      (S.sort === "sleepers" ? '<div class="note" style="margin-bottom:8px">Sorted by model rank minus real ADP &mdash; biggest gap first. A player at +30 is someone the room is letting fall 30 picks past where our model has him. Requires ADP data (<code>adp.py</code>); players with no ADP match are left out of this view.</div>' : "") +
      chips(S.filter) +
      '<input class="in" id="q" placeholder="Search a player&hellip;  (Enter = taken by someone else &mdash; click &#10003; on your own picks)" value="' + esc(S.q) + '" data-i="q" autocomplete="off">' +
      '<div class="note" style="margin:6px 0 2px"><span class="kbd">/</span> jump to search &middot; <span class="kbd">Ctrl+Z</span> undo the last pick &middot; click <span class="kbd">&#10003;</span> for your own picks</div>' +
      '<div id="list">' + boardList() + "</div>" +
    "</div><aside>" +
      '<div class="card"><div class="h" style="margin:0 0 9px">Your roster</div><div class="slots">' +
      starters.map(function (s) {
        return '<div class="slot" data-p="' + (s.p ? s.p.pos : "") + '">' +
          '<div class="slot-k">' + s.slot + "</div>" +
          '<div class="slot-v' + (s.p ? "" : " empty") + '">' + (s.p ? esc(s.p.name) : "open") + "</div>" +
          (s.p ? '<div class="num" style="font-size:11px;color:var(--dim)">' + sgn(s.p.vor) + "</div>" : "") + "</div>";
      }).join("") +
      (pool.length ? '<div class="note" style="margin-top:6px"><b>Bench:</b> ' + pool.map(function (p) { return esc(p.name); }).join(", ") + "</div>" : "") +
      (heavyByes.length ? '<div class="note" style="margin-top:6px;color:var(--alert)">' + heavyByes.map(function (w) {
        return byeCounts[w] + " starters on bye week " + w;
      }).join(" &middot; ") + "</div>" : "") +
      '</div><div class="note" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)">Total VOR banked: <b class="num" style="color:var(--gold)">' + banked + "</b></div></div>" +
      '<div class="row-btns"><button class="btn" data-a="undo" style="flex:1"' + (d.picks.length ? "" : " disabled") + ">Undo pick</button>" +
      '<button class="btn warn" data-a="reset">Clear draft</button></div>' +
    "</aside></div></div>";
}

/* ---- teams ---- */
// Every OTHER team's roster, built purely from pick attribution — see
// teamOnClock() and commit(). Nobody has to say who took a player; exact
// snake order already determines it. Only breaks if a trade happens
// mid-draft, which this tool doesn't model (see README's known gaps).
function teamName(lg, n) {
  if (lg.teamNames && lg.teamNames[n]) return lg.teamNames[n];
  return n === lg.slot ? "You" : "Team " + n;
}
function viewTeams() {
  var lg = league(), d = draft();
  var byId = {}; V.list.forEach(function (p) { byId[p.id] = p; });
  var byTeam = {};
  for (var n = 1; n <= lg.teams; n++) byTeam[n] = [];
  d.picks.forEach(function (pk, i) {
    var t = pk.team || (pk.mine ? lg.slot : null);
    if (t == null || !byTeam[t]) return;
    var p = byId[pk.id];
    byTeam[t].push({ p: p, pickNo: i + 1 });
  });
  var cards = [];
  for (var s = 1; s <= lg.teams; s++) {
    var picks = byTeam[s];
    var posCounts = {};
    picks.forEach(function (x) { if (x.p) posCounts[x.p.pos] = (posCounts[x.p.pos] || 0) + 1; });
    cards.push('<div class="card' + (s === lg.slot ? " you" : "") + '">' +
      '<div class="h" style="margin:0 0 7px;display:flex;justify-content:space-between;align-items:center">' +
      '<input class="in" id="teamname-' + s + '" style="width:auto;font:inherit;background:transparent;border:none;padding:0" ' +
        'value="' + esc(teamName(lg, s)) + '" data-i="teamname:' + s + '"' + (s === lg.slot ? " disabled title=\"This is your slot \\u2014 renamed on the League tab\"" : "") + '>' +
      '<span class="note" style="margin:0">' + picks.length + ' picks &middot; ' +
        VAL_POS.map(function (pos) { return posCounts[pos] ? pos + " " + posCounts[pos] : null; }).filter(Boolean).join(" &middot; ") +
      "</span></div>" +
      (picks.length ? '<div class="note">' + picks.map(function (x) {
        return "pk" + x.pickNo + " " + (x.p ? esc(x.p.pos) + " " + esc(x.p.name) : "(unknown player)");
      }).join(" &middot; ") + "</div>" : '<div class="note" style="color:var(--dim)">No picks yet.</div>') +
      "</div>");
  }
  return '<div class="pane">' +
    '<div class="note" style="margin-bottom:10px">Built automatically from the picks you mark &mdash; whoever is mathematically on the clock gets credit for each "someone else" pick, no extra step needed. Assumes straight snake order; if either league allows in-draft trades, attribution will drift from that point on.</div>' +
    cards.join("") + "</div>";
}

/* ---- values ---- */
function viewValues() {
  var lg = league();
  var items = (S.filter === "ALL" ? V.list : V.list.filter(function (p) { return p.pos === S.filter; })).slice(0, 220);
  return '<div class="pane"><div id="print-head">' + esc(lg.name) + " &mdash; " + lg.teams + " team " + PRESETS[lg.preset].label + " cheat sheet</div>" +
    '<div class="card"><div class="h" style="margin:0 0 9px">Replacement level &middot; ' + esc(lg.name) + "</div>" +
    '<div class="note" style="margin-bottom:9px">With ' + lg.teams + " teams and your starting slots, this is the last player at each position who starts somewhere in the league. Everything above him is real value; everything below is roster filler.</div>" +
    '<div class="grid">' + VAL_POS.map(function (pos) {
      return '<div class="fld"><div class="fld-k">' + pos + ' baseline</div><div class="num" style="font-size:17px;font-weight:600;color:var(' + POSVAR[pos] + ')">' + pos + V.base[pos] +
        (V.thin[pos] ? '<span style="color:var(--alert);font-size:11px"> *</span>' : "") + "</div></div>";
    }).join("") + "</div>" +
    (VAL_POS.some(function (p) { return V.thin[p]; }) ?
      '<div class="note" style="margin-top:10px;color:var(--alert)">* Your file runs out of players before this league fills its starters, so replacement level is projected from the tail rather than measured. Import deeper projections at ' +
      VAL_POS.filter(function (p) { return V.thin[p]; }).join(", ") + " and these numbers get sharper.</div>" : "") +
    '<div class="row-btns" style="margin-top:12px"><button class="btn" data-a="print">Print this cheat sheet</button>' +
    '<button class="btn" data-a="exportcsv">Download as CSV</button></div></div>' +
    (S.usingDemo ? '<div class="banner"><span>&#9888;</span><div>Demo projections &mdash; replace them on the Data tab before you trust a single number here.</div></div>' : "") +
    chips(S.filter) +
    playerRows(items, S.filter, S.filter === "ALL" ? "oTier" : "tier", false, null) + "</div>";
}

/* ---- league ---- */
function viewLeague() {

  return '<div class="pane">' +
    '<div class="card"><div class="h" style="margin:0 0 11px">Setup</div>' +
    '<div class="fld" style="margin-bottom:11px"><div class="fld-k">League name</div>' +

    '<div class="fld"><div class="fld-k">Scoring</div><div class="filters" style="margin:3px 0 0">' +

    }).join("") + "</div></div></div>" +

    '<div class="grid">' + ROSTER_KEYS.map(function (k) {

    [["passYd","Pass yd"],["passTD","Pass TD"],["int","INT"],["rushYd","Rush yd"],["rushTD","Rush TD"],
     ["rec","Reception"],["recYd","Rec yd"],["recTD","Rec TD"],["fl","Fumble"]].map(function (s) {

  }
}

/* ---- data ---- */

    '<b>Pre-scored</b> &mdash; a single FPTS column. Faster, but the points are locked to whatever scoring produced them, so they will be wrong in your other leagues.</div>' +
    '<input type="file" accept=".csv,.tsv,.txt" id="file" class="in" style="margin-bottom:9px">' +
    '<textarea class="in" id="paste" rows="7" placeholder="' + esc(TEMPLATE.replace(/\\\\n/g, "\n")) + '" style="font-family:var(--mono);font-size:11.5px;resize:vertical" data-i="paste"></textarea>' +
    '<div id="err" class="note" style="color:var(--alert);margin-top:8px"></div>' +

    '<button class="btn" data-a="demo">Back to demo</button></div></div>' +

    '<div class="row-btns"><button class="btn" data-a="exportjson" style="flex:1">Export everything</button>' +
    '<input type="file" accept=".json" id="restore" class="in" style="flex:1"></div></div>' +

    '<div class="card"><div class="h" style="margin:0 0 9px">Refresh before you draft</div>' +
    '<div class="note">Projections move all through camp &mdash; a starter goes down in mid-August and half your board reshuffles. Re-import the morning of each draft. The engine is the durable part; the numbers are perishable.</div></div></div>';
}

/* ---------- paint ---------- */
function render() {
  recompute();
  var a = document.activeElement;
  var fid = a && a.id ? a.id : null;
  var sel = a && a.selectionStart != null ? a.selectionStart : null;

  renderChrome();
  renderClock();
  var v = S.tab === "board" ? viewBoard() : S.tab === "teams" ? viewTeams() : S.tab === "values" ? viewValues() : S.tab === "league" ? viewLeague() : viewData();
  document.getElementById("main").innerHTML = v;
  wireFiles();

  if (fid) {
    var n = document.getElementById(fid);
    if (n) {
      n.focus();
      if (sel != null && n.setSelectionRange) { try { n.setSelectionRange(sel, sel); } catch (e) {} }
    }
  }
}

/* ---------- actions ---------- */
function commit(id, mine) {
  var lg = league(), cur = S.drafts[lg.id] || { picks: [] };
  if (cur.picks.some(function (p) { return p.id === id; })) return;
  // Team attribution is automatic, not asked for: exact snake order is fully
  // determined by team count + your slot (no trades assumed), so whichever
  // team is mathematically on the clock right now is who took this pick.
  // onClock must be computed from cur.picks.length BEFORE the new pick is
  // appended below, matching clockInfo()'s convention exactly.
  var onClock = cur.picks.length + 1;
  var team = mine ? lg.slot : teamOnClock(onClock, lg.teams);
  S.drafts[lg.id] = { picks: cur.picks.concat([{ id: id, mine: mine, team: team }]) };
  S.q = "";
  save(); render();
}
function undo() {
  var lg = league(), cur = S.drafts[lg.id] || { picks: [] };
  S.drafts[lg.id] = { picks: cur.picks.slice(0, -1) };
  save(); render();
}
function patch(obj) {
  var lg = league();
  Object.keys(obj).forEach(function (k) { lg[k] = obj[k]; });
  save(); render();
}
function exportCSV() {
  var lg = league();
  var head = "Rank,Player,Pos,PosRank,Tier,Points,VOR\n";
  var body = V.list.map(function (p) {
    return [p.ovr, '"' + p.name.replace(/"/g, '""') + '"', p.pos, p.pos + p.posRank, p.tier, p.pts, p.vor].join(",");
  }).join("\n");
  download(lg.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-cheatsheet.csv", head + body, "text/csv");
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-a]");
  if (!t) return;
  var a = t.getAttribute("data-a"), v = t.getAttribute("data-v");

  if (a === "tab") { S.tab = v; render(); }
  else if (a === "filter") { S.filter = v; render(); }
  else if (a === "sort") { S.sort = v; render(); }
  else if (a === "pick") { commit(v, t.getAttribute("data-m") === "1"); }
  else if (a === "undo") { undo(); }
  else if (a === "reset") {
    if (confirm("Clear every pick in " + league().name + "?")) { S.drafts[league().id] = { picks: [] }; save(); render(); }
  }
  else if (a === "preset") { var lg = league(); lg.preset = v; lg.scoring.rec = PRESETS[v].rec; save(); render(); }
  else if (a === "addleague") {
    var nl = newLeague("League " + (S.leagues.length + 1), "half", 12, 1);
    S.leagues.push(nl); S.activeId = nl.id; save(); render();
  }
  else if (a === "delleague") {
    if (S.leagues.length === 1) return;
    if (!confirm("Delete " + league().name + "?")) return;
    var gone = league().id;
    S.leagues = S.leagues.filter(function (l) { return l.id !== gone; });
    delete S.drafts[gone];
    S.activeId = S.leagues[0].id; save(); render();
  }
  else if (a === "print") { window.print(); }
  else if (a === "exportcsv") { exportCSV(); }
  else if (a === "exportjson") {
    download("draft-war-room-backup.json", JSON.stringify({
      leagues: S.leagues, activeId: S.activeId, players: S.players, usingDemo: S.usingDemo, drafts: S.drafts
    }, null, 2), "application/json");
  }
  else if (a === "demo") { S.players = demoPlayers(); S.usingDemo = true; S.flash = "Back on the demo set."; save(); render(); }
  else if (a === "loadpaste") {
    var box = document.getElementById("paste");
    try {
      var rows = parseCSV(box.value);
      S.players = rows; S.usingDemo = false;
      S.flash = "Loaded " + rows.length + " players.";
      save(); render();
    } catch (err) { document.getElementById("err").textContent = err.message; }
  }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "leaguesel") { S.activeId = e.target.value; S.q = ""; save(); render(); }
});

document.addEventListener("input", function (e) {
  var k = e.target.getAttribute("data-i");
  if (!k) return;
  var lg = league(), val = e.target.value;

  if (k === "q") {
    S.q = val;
    var box = document.getElementById("list");
    if (box) box.innerHTML = boardList();
    return;
  }
  if (k === "paste") return;
  if (k === "name") { lg.name = val; save(); renderChrome(); return; }
  if (k.indexOf("teamname:") === 0) {
    lg.teamNames = lg.teamNames || {};
    lg.teamNames[k.slice(9)] = val;
    save(); render(); return;
  }
  if (k === "teams") { lg.teams = Math.max(4, parseInt(val) || 12); }
  else if (k === "slot") { lg.slot = Math.min(lg.teams, Math.max(1, parseInt(val) || 1)); }
  else if (k.indexOf("roster:") === 0) { lg.roster[k.slice(7)] = Math.max(0, parseInt(val) || 0); }
  else if (k.indexOf("scoring:") === 0) { lg.scoring[k.slice(8)] = parseFloat(val) || 0; }
  save(); render();
});

document.addEventListener("keydown", function (e) {
  var inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);

  if (e.key === "/" && !inField) { e.preventDefault(); var q = document.getElementById("q"); if (q) q.focus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !inField) { e.preventDefault(); undo(); return; }
  if (e.key === "Enter" && e.target.id === "q") {
    // Marking your OWN pick is deliberately click-only now (the checkmark
    // button on every row) — Shift+Enter was too easy to fat-finger under
    // draft-night pressure and silently misattribute a pick. Plain Enter
    // still fast-paths the much more common case: someone else took him.
    e.preventDefault();
    var top = filtered()[0];
    if (top) commit(top.id, false);
  }
  if (e.key === "Escape" && e.target.id === "q") { S.q = ""; render(); }
});

function wireFiles() {
  var f = document.getElementById("file");
  if (f) f.onchange = function () {
    var file = f.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var rows = parseCSV(r.result);
        S.players = rows; S.usingDemo = false;
        S.flash = "Loaded " + rows.length + " players from " + file.name + ".";
        save(); render();
      } catch (err) { document.getElementById("err").textContent = err.message; }
    };
    r.readAsText(file);
  };
  var rs = document.getElementById("restore");
  if (rs) rs.onchange = function () {
    var file = rs.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d.leagues) throw new Error("That is not a War Room backup.");
        S.leagues = d.leagues; S.activeId = d.activeId || d.leagues[0].id;
        S.players = d.players || demoPlayers(); S.usingDemo = !!d.usingDemo; S.drafts = d.drafts || {};
        S.flash = "Backup restored.";
        save(); render();
      } catch (err) { document.getElementById("err").textContent = err.message; }
    };
    r.readAsText(file);
  };
}

/* ---------- go ---------- */
load();
if (!S.activeId) S.activeId = S.leagues[0].id;
render();
</script>
</body>
